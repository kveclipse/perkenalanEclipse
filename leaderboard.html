<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width,
    initial-scale=1.0">

    <title>Leaderboard</title>

    <link rel="stylesheet"
    href="css/style.css">

    <link rel="stylesheet"
    href="css/leaderboard.css">

</head>
<body>

    <!-- NAVBAR -->

    <nav>

        <div class="logo">
            GoldenSilver
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="game.html">
                Game
            </a>

            <a href="gallery.html">
                Gallery
            </a>

            <a href="leaderboard.html">
                Leaderboard
            </a>

            <a href="admin.html">
                Admin
            </a>

        </div>

    </nav>

    <!-- HEADER -->

    <section class="leaderboard-header">

        <h1>
            Global Leaderboard
        </h1>

        <p>
            Top player dari dunia
            GoldenSilver ✨
        </p>

    </section>

    <!-- LEADERBOARD -->

    <section class="leaderboard-container">

        <!-- RANK 1 -->

        <div class="leaderboard-card top1">

            <div class="rank">
                #1
            </div>

            <div class="player-info">

                <h2>
                    Guest_155
                </h2>

                <p>
                    Golden Hero
                </p>

            </div>

            <div class="score">
                5500
            </div>

        </div>

        <!-- RANK 2 -->

        <div class="leaderboard-card top2">

            <div class="rank">
                #2
            </div>

            <div class="player-info">

                <h2>
                    Guest_221
                </h2>

                <p>
                    Guardian
                </p>

            </div>

            <div class="score">
                3200
            </div>

        </div>

        <!-- RANK 3 -->

        <div class="leaderboard-card top3">

            <div class="rank">
                #3
            </div>

            <div class="player-info">

                <h2>
                    Guest_912
                </h2>

                <p>
                    Explorer
                </p>

            </div>

            <div class="score">
                1800
            </div>

        </div>

        <!-- RANK 4 -->

        <div class="leaderboard-card">

            <div class="rank">
                #4
            </div>

            <div class="player-info">

                <h2>
                    Guest_551
                </h2>

                <p>
                    Traveler
                </p>

            </div>

            <div class="score">
                1200
            </div>

        </div>

    </section>

    <!-- PLAYER -->

    <section class="your-rank">

        <div class="your-rank-card">

            <h2>
                Your Profile
            </h2>

            <h1 id="playerName">
                Guest
            </h1>

            <p id="playerRole">
                Traveler
            </p>

            <div class="your-score">

                <h2>
                    Your Score
                </h2>

                <h1 id="playerScore">
                    0
                </h1>

            </div>

        </div>

    </section>

    <script src="js/leaderboard.js"></script>

</body>
</html>
